<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Dashboard VPS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Private Monitor</p>
        <h1>Dashboard VPS</h1>
        <p class="auth-copy">
          Pantau beban server dan trafik pengunjung dari satu panel yang berdiri
          sendiri.
        </p>

        <form id="login-form" class="auth-form">
          <label class="form-label mb-0">
            Username
            <input
              class="form-control form-control-lg rounded-4"
              type="text"
              name="username"
              placeholder="admin"
              required
            />
          </label>

          <label class="form-label mb-0">
            Password
            <input
              class="form-control form-control-lg rounded-4"
              type="password"
              name="password"
              placeholder="Masukkan password"
              required
            />
          </label>

          <button class="btn btn-dark btn-lg rounded-pill" type="submit">Masuk</button>
          <p id="error-message" class="error-message"></p>
        </form>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
